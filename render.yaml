services:
  - type: web
    name: streaktrack-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://streaktrack.vercel.app
